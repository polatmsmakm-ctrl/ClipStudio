# =============================================================================
# ClipStudio — GitHub Actions: build IPA
# Location in the repo: .github/workflows/build.yml
# (Shipped in the ZIP as github-workflows/build.yml because the iOS Files app
#  cannot store folders that start with a dot. Create it on GitHub's website.)
#
# 1. Unsigned IPA (always) → for Sideloadly.
# 2. Signed IPA (only when signing secrets exist) → see docs/HANDOFF.md §6.
# =============================================================================

name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APP_NAME: ClipStudio
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.WIDGET_PROVISION_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          brew install ldid || echo "ldid not available — entitlements will not be embedded"

      - name: Generate app icon (only if missing)
        run: |
          ICON="ClipStudio/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ ! -f "$ICON" ]; then
            swift Scripts/generate_app_icon.swift "$ICON"
          fi
          ls -l "$ICON"

      - name: Inject build secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ClipStudio/Generated
          python3 - <<'PY'
          import os, json
          key = os.environ.get("GEMINI_API_KEY", "") or ""
          body = (
              "// Generated by GitHub Actions at build time. Do not commit real values.\n"
              "enum BuildSecrets {\n"
              "    static let geminiDefaultKey: String = " + json.dumps(key) + "\n"
              "}\n"
          )
          open("ClipStudio/Generated/BuildSecrets.swift", "w").write(body)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClipStudio.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package IPA
        run: |
          APP="build/ClipStudio.xcarchive/Products/Applications/ClipStudio.app"
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          # Embed entitlements (App Group for the widget) with a fake signature so
          # Sideloadly can read and re-apply them when it signs the app.
          if command -v ldid >/dev/null 2>&1; then
            ldid -SClipStudioWidget/ClipStudioWidget.entitlements "Payload/ClipStudio.app/PlugIns/ClipStudioWidget.appex/ClipStudioWidget" || true
            ldid -SClipStudio/ClipStudio.entitlements "Payload/ClipStudio.app/ClipStudio" || true
          fi
          zip -qry ClipStudio.ipa Payload
          ls -lh ClipStudio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-ipa
          path: ClipStudio.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ClipStudio.ipa \
            --title "ClipStudio $TAG" \
            --notes "IPA غير موقّع — ثبّته عبر Sideloadly. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"

      # ------------------------------------------------------------------
      # Optional signed build — runs only when all signing secrets exist.
      # ------------------------------------------------------------------
      - name: Import certificate and provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12
          APP_PP=$RUNNER_TEMP/app.mobileprovision
          WIDGET_PP=$RUNNER_TEMP/widget.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD="${{ github.run_id }}-kc"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$APP_PP"
          echo -n "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o "$WIDGET_PP"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$APP_PP" ~/Library/MobileDevice/Provisioning\ Profiles/
          cp "$WIDGET_PP" ~/Library/MobileDevice/Provisioning\ Profiles/
          APP_PROFILE_NAME=$(security cms -D -i "$APP_PP" | plutil -extract Name raw -)
          WIDGET_PROFILE_NAME=$(security cms -D -i "$WIDGET_PP" | plutil -extract Name raw -)
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -n 1 | awk '{print $2}')
          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          METHOD="${EXPORT_METHOD:-release-testing}"
          cat > project-signed.yml <<EOF
          include:
            - project.yml
          targets:
            ClipStudio:
              settings:
                base:
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: "$TEAM_ID"
                  CODE_SIGN_IDENTITY: "$SIGN_IDENTITY"
                  PROVISIONING_PROFILE_SPECIFIER: "$APP_PROFILE_NAME"
            ClipStudioWidget:
              settings:
                base:
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: "$TEAM_ID"
                  CODE_SIGN_IDENTITY: "$SIGN_IDENTITY"
                  PROVISIONING_PROFILE_SPECIFIER: "$WIDGET_PROFILE_NAME"
          EOF
          xcodegen generate --spec project-signed.yml
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.rashid.clipstudio</key><string>$APP_PROFILE_NAME</string>
              <key>com.rashid.clipstudio.widget</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild archive \
            -project ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClipStudioSigned.xcarchive \
            -quiet
          xcodebuild -exportArchive \
            -archivePath build/ClipStudioSigned.xcarchive \
            -exportPath build/signed \
            -exportOptionsPlist ExportOptions.plist
          cp build/signed/*.ipa ClipStudio-signed.ipa

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-signed-ipa
          path: ClipStudio-signed.ipa

      - name: Attach signed IPA to release
        if: env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "build-${{ github.run_number }}" ClipStudio-signed.ipa --clobber

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  tests:
    name: Unit tests (non-blocking)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Prepare project
        run: |
          brew install xcodegen
          ICON="ClipStudio/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          [ -f "$ICON" ] || swift Scripts/generate_app_icon.swift "$ICON"
          xcodegen generate

      - name: Run unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, devices in data.items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")]
          print(ids[-1] if ids else "")
          ')
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
